[build]
  command = "pip install -r requirements.txt && python3 build.py"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.11"
  # DEMO=1 was removed on 9 Nov 2026: the site is live on rjrhomeimprovements.com
  # and must be indexable. Only set DEMO for a throwaway preview build.

# Send www to the main domain (only takes effect once the domain is connected)
[[redirects]]
  from = "https://www.rjrhomeimprovements.com/*"
  to = "https://rjrhomeimprovements.com/:splat"
  status = 301
  force = true

# Page redirects for retired URLs live in static/_redirects (copied into site/).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
